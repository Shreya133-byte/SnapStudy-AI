version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: snapstudy-backend
    ports:
      - "8011:8011"
    env_file:
      - ./backend/.env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=8011
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: snapstudy-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
